version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: ai_postgres
    restart: always
    environment:
      POSTGRES_DB: ai_banking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: ai_redis
    ports:
      - "6379:6379"

  django:
    build: .
    container_name: ai_django
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis

  celery:
    build: .
    container_name: ai_celery
    command: celery -A AIproject worker -l info
    volumes:
      - .:/app
    depends_on:
      - redis
      - postgres

volumes:
  postgres_data: