<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Banking Assistant — Login</title>
    <link rel="stylesheet" href="{% static 'AIapp/css/base.css' %}">
    <link rel="stylesheet" href="{% static 'AIapp/css/login.css' %}">
</head>

<body>
<div class="app-wrapper">
    <div class="card">

        <div class="header">
            <h1>AI Banking Assistant</h1>
            <p>Secure Voice Financial Support</p>
        </div>

        <form method="post">
            {% csrf_token %}

            {% if form.errors %}
            <div class="error">
                Invalid username or password. Please try again.
            </div>
            {% endif %}

            <div class="form-group">
                <label>Username</label>
                <input
                    type="text"
                    name="username"
                    placeholder="Enter your username"
                    autofocus
                >
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                >
            </div>

            <button type="submit" class="login-btn">
                Sign In
            </button>

        </form>

    </div>
</div>
</body>
</html>
